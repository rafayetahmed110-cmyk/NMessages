name: NMessages CI & Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flutter-android-build:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: |
          cd n_messages
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd n_messages
          flutter analyze --no-fatal-infos || true

      - name: Build Android Release APK
        run: |
          cd n_messages
          flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: |
          cd n_messages
          flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NMessages-Release-APK
          path: n_messages/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: NMessages-Release-AAB
          path: n_messages/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  web-simulator-build:
    name: Build Web App Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: Build Full-Stack Production Bundle
        run: npm run build
