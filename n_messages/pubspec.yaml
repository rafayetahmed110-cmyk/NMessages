name: n_messages
description: "NMessages - A modern, fast, secure default Android SMS application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  intl: ^0.18.1
  cupertino_icons: ^1.0.6

  # Storage & Permissions
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  device_info_plus: ^9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
